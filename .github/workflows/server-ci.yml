name: Server CI

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'

jobs:
  test:
    name: Test Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: |
          cd server
          npm install
          
      - name: Run type checking
        run: |
          cd server
          npm run type-check
          
      - name: Run tests
        run: |
          cd server
          npm test
          
      - name: Run tests with coverage
        run: |
          cd server
          npm run test:coverage
        continue-on-error: true
